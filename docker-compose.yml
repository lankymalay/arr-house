services:
  arr-house:
    build:
      context: .
      dockerfile: Dockerfile
    image: arr-house:latest
    container_name: arr-house
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - ARR_DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
