<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="sailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Icon Base Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="1.5" fill="none"/>

  <!-- Subtle glow beneath ship -->
  <ellipse cx="32" cy="46" rx="20" ry="4" fill="#06b6d4" fill-opacity="0.15" filter="url(#glow)"/>

  <!-- Main Rigging / Masts -->
  <!-- Main Mast (Center) -->
  <line x1="33" y1="9" x2="33" y2="40" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Fore Mast (Left) -->
  <line x1="21" y1="18" x2="21" y2="40" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bowsprit Spar (Front angled forward) -->
  <line x1="45" y1="39" x2="55" y2="30" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Pirate Jolly Roger Pennant / Flag atop Main Mast -->
  <path d="M33 9 L44 12 L33 15 Z" fill="url(#flagGrad)"/>
  <!-- Skull dot & crossbone hint on flag -->
  <circle cx="37" cy="12" r="1.1" fill="#0f172a"/>
  <line x1="39" y1="11" x2="41" y2="13" stroke="#0f172a" stroke-width="0.7"/>

  <!-- Foremast Pennant -->
  <path d="M21 17 L27 19 L21 21 Z" fill="#38bdf8"/>

  <!-- Main Topsail -->
  <path d="M27 16 C31 15 35 15 39 16 C38 20 35 22 28 22 C28 19 27 17 27 16 Z" fill="url(#sailGrad)"/>
  <!-- Main Course (Lower big sail) -->
  <path d="M25 24 C31 23 37 23 42 24 C41 32 37 36 26 36 C27 30 26 26 25 24 Z" fill="url(#sailGrad)" filter="url(#glow)"/>

  <!-- Foremast Sail -->
  <path d="M15 22 C19 21 23 21 27 22 C26 29 23 32 16 32 C17 27 16 24 15 22 Z" fill="url(#sailGrad)"/>

  <!-- Jib (Triangular Head Sail attached to bowsprit) -->
  <path d="M36 26 L51 36 L36 36 Z" fill="url(#sailGrad)" fill-opacity="0.85"/>

  <!-- Galleon Pirate Ship Hull -->
  <!-- High sterncastle at back, sleek curved sheer line, carved ram bow -->
  <path d="M11 37 C14 36 17 38 21 39 L47 39 C50 39 53 37 54 35 C52 42 46 45 32 45 C18 45 12 42 11 37 Z" fill="url(#hullGrad)"/>
  <!-- Hull Gunports / Trim Line -->
  <path d="M16 41 C24 43 38 43 47 41" stroke="#06b6d4" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="23" cy="41.2" r="0.8" fill="#0f172a"/>
  <circle cx="29" cy="41.5" r="0.8" fill="#0f172a"/>
  <circle cx="35" cy="41.5" r="0.8" fill="#0f172a"/>
  <circle cx="41" cy="41.2" r="0.8" fill="#0f172a"/>

  <!-- Cresting Ocean Waves -->
  <path d="M9 48 C14 45.5 19 45.5 24 48 C29 50.5 34 50.5 39 48 C44 45.5 49 45.5 55 48" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M13 52 C17 50.5 22 50.5 26 52 C30 53.5 35 53.5 39 52 C43 50.5 48 50.5 52 52" stroke="#0284c7" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.8"/>
</svg>
