<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Badge Gradient - Rich, Clean, Deep Obsidian -->
    <linearGradient id="tvStackFavBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111726"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <!-- 1. Sonarr - Clear Vibrant Electric Cyan -->
    <linearGradient id="sonarrFavGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0099ff"/>
    </linearGradient>

    <!-- 2. Radarr - Clear Vibrant Warm Amber Gold -->
    <linearGradient id="radarrFavGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffc107"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>

    <!-- 3. Lidarr - Clear Vibrant Vivid Emerald Green -->
    <linearGradient id="lidarrFavGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10e070"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- 4. Prowlarr - Clear Vibrant Deep Coral Orange -->
    <linearGradient id="prowlarrFavGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#e63946"/>
    </linearGradient>
  </defs>

  <!-- Container Base Badge -->
  <rect width="64" height="64" rx="16" fill="url(#tvStackFavBg)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="#2e3b52" stroke-width="1.2" fill="none"/>

  <!-- TV Aerial Antenna (High Contrast Silver & Pure White Tips) -->
  <line x1="32" y1="19.5" x2="25" y2="15.2" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
  <circle cx="25" cy="15.2" r="1.6" fill="#ffffff"/>

  <line x1="32" y1="19.5" x2="39" y2="15.2" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
  <circle cx="39" cy="15.2" r="1.6" fill="#ffffff"/>

  <circle cx="32" cy="19.5" r="1.8" fill="#94a3b8"/>

  <!-- Four Stacked Service Blocks (Square 36x36 Bounding Box) -->
  <!-- 1. Sonarr (Cyan - TV) -->
  <rect x="14" y="19.7" width="36" height="6.6" rx="2" fill="url(#sonarrFavGrad)"/>
  <line x1="16" y1="20.5" x2="48" y2="20.5" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.4"/>

  <!-- 2. Radarr (Amber Gold - Movies) -->
  <rect x="14" y="27.6" width="36" height="6.6" rx="2" fill="url(#radarrFavGrad)"/>
  <line x1="16" y1="28.4" x2="48" y2="28.4" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.4"/>

  <!-- 3. Lidarr (Emerald Green - Music) -->
  <rect x="14" y="35.5" width="36" height="6.6" rx="2" fill="url(#lidarrFavGrad)"/>
  <line x1="16" y1="36.3" x2="48" y2="36.3" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.4"/>

  <!-- 4. Prowlarr (Deep Coral Orange - Indexers) -->
  <rect x="14" y="43.4" width="36" height="6.6" rx="2" fill="url(#prowlarrFavGrad)"/>
  <line x1="16" y1="44.2" x2="48" y2="44.2" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.4"/>
</svg>
