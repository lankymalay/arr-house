<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Badge Gradient -->
    <linearGradient id="arhFavBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2536"/>
      <stop offset="100%" stop-color="#0e131d"/>
    </linearGradient>

    <!-- Roof Gradient -->
    <linearGradient id="arhFavRoof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Flag Gradient -->
    <linearGradient id="arhFavFlag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Hull Gradient -->
    <linearGradient id="arhFavHull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b3952"/>
      <stop offset="100%" stop-color="#151e2e"/>
    </linearGradient>
  </defs>

  <!-- Container Base Badge -->
  <rect width="64" height="64" rx="16" fill="url(#arhFavBg)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="#3b455b" stroke-width="1.2" fill="none"/>

  <!-- 1. Main Ship Mast -->
  <line x1="32" y1="6" x2="32" y2="18" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="32" cy="6" r="1.5" fill="#38bdf8"/>

  <!-- 2. Pirate Swallowtail Pennant Flag -->
  <path d="M 32 7.5 L 46 11.5 L 40 14 L 46 16.5 L 32 17.5 Z" fill="url(#arhFavFlag)"/>
  <circle cx="36" cy="12.5" r="1" fill="#ffffff"/>

  <!-- 3. House Gable Roof -->
  <path d="M 14 27.5 L 32 15 L 50 27.5 L 46 29 L 32 19 L 18 29 Z" fill="url(#arhFavRoof)"/>
  <circle cx="32" cy="23.5" r="2.5" fill="#0f172a" stroke="#60a5fa" stroke-width="1"/>
  <circle cx="32" cy="23.5" r="1.2" fill="#69f0ae"/>

  <!-- 4. Server Stack Blade 1 -->
  <rect x="17" y="30" width="30" height="5.5" rx="1.5" fill="#1e293b" stroke="#3b455b" stroke-width="1"/>
  <rect x="20.5" y="32" width="16" height="1.5" rx="0.75" fill="#475569"/>
  <circle cx="42.5" cy="32.75" r="1.2" fill="#38bdf8"/>

  <!-- 5. Server Stack Blade 2 -->
  <rect x="17" y="37.5" width="30" height="5.5" rx="1.5" fill="#1e293b" stroke="#3b455b" stroke-width="1"/>
  <rect x="20.5" y="39.5" width="16" height="1.5" rx="0.75" fill="#475569"/>
  <circle cx="42.5" cy="40.25" r="1.2" fill="#69f0ae"/>

  <!-- 6. Server Stack Blade 3 / Galleon Hull -->
  <path d="M 17 45 L 47 45 C 51.5 45 54 43 54 43 C 52.5 49 44 54 32 54 C 20 54 11.5 49 10 43 C 10 43 12.5 45 17 45 Z" fill="url(#arhFavHull)" stroke="#475569" stroke-width="1.2"/>
  <path d="M 16 48.5 C 23 51 41 51 48 48.5" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="25" cy="48" r="1" fill="#38bdf8"/>
  <circle cx="32" cy="49" r="1" fill="#69f0ae"/>
  <circle cx="39" cy="48" r="1" fill="#38bdf8"/>

  <!-- 7. Minimal Keel Wake Wave -->
  <path d="M 19 57.5 C 25 56 39 56 45 57.5" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
</svg>
